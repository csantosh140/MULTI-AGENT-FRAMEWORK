ms-center justify-center shadow-[0_10px_25px_-5px_rgba(79,70,229,0.3)] mb-1"><span class="material-symbols-outlined text-on-primary text-[28px]">shield_lock</span></div><h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight font-bold">Suraksha-AI</h1><h2 class="font-headline-md text-headline-md text-on-surface font-semibold mt-1">Welcome back</h2><p class="font-body-md text-body-md text-on-surface-variant">Sign in to your Suraksha-AI account</p></div><form class="flex flex-col gap-space-sm" id="enterprise-auth-form" onsubmit="return false;"><div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface font-medium" for="work-email">Work Email</label><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px] pointer-events-none">mail</span><input class="w-full pl-10 pr-3 py-2.5 rounded-lg bg-surface-container-low focus:bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none transition-all placeholder:text-outline-variant focus:shadow-[0_0_0_2px_rgba(79,70,229,0.3)]" id="work-email" placeholder="name@company.com" required="" type="email"></div></div><div class="flex flex-col gap-1.5"><div class="flex items-center justify-between"><label class="font-label-md text-label-md text-on-surface font-medium" for="work-password">Password</label><a class="font-label-sm text-label-sm text-primary hover:underline transition-colors" href="#">Forgot password?</a></div><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px] pointer-events-none">lock</span><input class="w-full pl-10 pr-10 py-2.5 rounded-lg bg-surface-container-low focus:bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none transition-all placeholder:text-outline-variant focus:shadow-[0_0_0_2px_rgba(79,70,229,0.3)]" id="work-password" placeholder="••••••••••••" required="" type="password"><button aria-label="Toggle password visibility" class="absolute right-2 p-1.5 rounded-full text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center focus:outline-none" id="toggle-pwd-btn" type="button"><span class="material-symbols-outlined text-[18px]" id="pwd-icon">visibility</span></button></div></div><div class="flex items-center justify-between pt-1"><label class="flex items-center gap-2 cursor-pointer select-none"><input checked="" class="h-4 w-4 rounded accent-primary-container cursor-pointer" id="remember-device" type="checkbox"><span class="font-body-sm text-body-sm text-on-surface font-medium">Remember me</span></label></div><div class="hidden rounded-lg p-space-sm bg-surface-container font-label-md text-label-md flex items-center gap-2" id="auth-alert"><span class="material-symbols-outlined text-[16px] text-primary" id="alert-icon">sync</span><span class="text-on-surface" id="alert-msg">Signing in...</span></div><button class="w-full mt-2 py-3 rounded-lg bg-primary-container text-on-primary font-headline-md text-[15px] font-bold shadow-md hover:bg-primary transition-all duration-200 flex items-center justify-center gap-2 active:scale-[0.99]" id="auth-submit-btn" type="submit"><span class="">Sign In</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span></button></form><div class="pt-space-xs text-center border-t border-surface-container"><p class="font-body-sm text-body-sm text-on-surface-variant">Don't have an account? <a class="text-primary font-semibold hover:underline" href="#">Sign up</a></p></div></div></div>
<script>
  // Simple interactive micro-interactions for password toggling and simulated sign in
  const pwdInput = document.getElementById('work-password');
  const toggleBtn = document.getElementById('toggle-pwd-btn');
  const pwdIcon = document.getElementById('pwd-icon');

  if (toggleBtn && pwdInput && pwdIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  const authForm = document.getElementById('enterprise-auth-form');
  const authBtn = document.getElementById('auth-submit-btn');
  const authAlert = document.getElementById('auth-alert');
  const alertMsg = document.getElementById('alert-msg');
  const alertIcon = document.getElementById('alert-icon');

  if (authForm && authBtn && authAlert) {
    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      authAlert.classList.remove('hidden');
      alertIcon.textContent = 'hourglass_empty';
      alertIcon.classList.add('animate-spin');
      alertMsg.textContent = 'Authenticating with Suraksha-AI Identity Broker...';
      authBtn.setAttribute('disabled', 'true');
      authBtn.classList.add('opacity-75', 'cursor-not-allowed');

      setTimeout(() => {
        alertIcon.classList.remove('animate-spin');
        alertIcon.textContent = 'verified_user';
        alertMsg.textContent = 'Credentials accepted. Routing to SecOps Command Dashboard...';
        
        setTimeout(() => {
          authBtn.removeAttribute('disabled');
          authBtn.classList.remove('opacity-75', 'cursor-not-allowed');
          alertMsg.textContent = 'Welcome, Security Analyst. Session established.';
        }, 1200);
      }, 1000);
    });
  }
</script></main><footer class="w-full bg-surface-container-lowest/70 backdrop-blur-xl py-space-md shadow-[0_-1px_8px_rgba(0,0,0,0.03)]"><div class="w-full px-gutter flex flex-col sm:flex-row items-center justify-between gap-space-sm text-on-surface-variant font-body-sm text-body-sm max-w-md mx-auto"><span class="text-center sm:text-left">© 2025 Suraksha-AI Inc.</span><div class="flex items-center gap-space-md justify-center"><a class="hover:text-primary transition-colors" href="#">Privacy Policy</a><a class="hover:text-primary transition-colors" href="#">Terms of Service</a></div></div></footer>
